  /tokens:
    post:
      description: Authenticate
      x-openapi-router-controller: vAPI
      operationId: get_token
      requestBody:
        content:
          'application/json':
            schema:
              type: object
              properties:
                password:
                  type: string
                username:
                  type: string
            examples:
              '0':
                value: |-
                  {"username": "user1",
                   "password":"pass1"}
      responses:
        '200':
          description: Authentication response
          content:
            'application/json':
              schema:
                type: string
              examples: {}
        '400':
          description: Invalid input
          content:
            'application/problem+json':
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            'application/json':
              schema:
                type: string
              examples:
                '0':
                  value: |-
                    {
                      "error": {
                        "message": "username  not found"
                      }
                    }
